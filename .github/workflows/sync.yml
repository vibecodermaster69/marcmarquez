name: sync

# Ingests results one hour after each race is expected to end.
#
# GENERATED by `npm run gen:workflow` from the calendar in phoenix93.db.
# Do not hand-edit the cron list; re-run the generator instead.
#
# GitHub cron is UTC and can be delayed under load, so two safety nets follow
# the exact times: an hourly sweep across race weekends, and a daily backstop.
# Every run is idempotent and only ingests sessions motogp.com reports FINISHED,
# so an extra run costs one HTTP request and changes nothing.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the post-race wait; MotoGP must still report the session FINISHED."
        required: false
        default: false
        type: boolean
  schedule:
    # R14 RSM SPR — Sat 12 Sept, 22:10 IST
    - cron: "40 16 12 9 *"
    # R14 RSM RAC — Sun 13 Sept, 21:45 IST
    - cron: "15 16 13 9 *"
    # R15 AUT SPR — Sat 19 Sept, 22:10 IST
    - cron: "40 16 19 9 *"
    # R15 AUT RAC — Sun 20 Sept, 21:45 IST
    - cron: "15 16 20 9 *"
    # R16 JPN SPR — Sat 03 Oct, 22:10 IST
    - cron: "40 16 3 10 *"
    # R16 JPN RAC — Sun 04 Oct, 21:45 IST
    - cron: "15 16 4 10 *"
    # R17 INA SPR — Sat 10 Oct, 22:10 IST
    - cron: "40 16 10 10 *"
    # R17 INA RAC — Sun 11 Oct, 21:45 IST
    - cron: "15 16 11 10 *"
    # R18 AUS SPR — Sat 24 Oct, 22:10 IST
    - cron: "40 16 24 10 *"
    # R18 AUS RAC — Sun 25 Oct, 21:45 IST
    - cron: "15 16 25 10 *"
    # R19 MAL SPR — Sat 31 Oct, 22:10 IST
    - cron: "40 16 31 10 *"
    # R19 MAL RAC — Sun 01 Nov, 22:45 IST
    - cron: "15 17 1 11 *"
    # R20 QAT SPR — Sun 08 Nov, 03:10 IST
    - cron: "40 21 7 11 *"
    # R20 QAT RAC — Mon 09 Nov, 03:45 IST
    - cron: "15 22 8 11 *"
    # R21 POR SPR — Sat 21 Nov, 22:10 IST
    - cron: "40 16 21 11 *"
    # R21 POR RAC — Sun 22 Nov, 20:45 IST
    - cron: "15 15 22 11 *"
    # R22 VAL SPR — Sat 28 Nov, 22:10 IST
    - cron: "40 16 28 11 *"
    # R22 VAL RAC — Sun 29 Nov, 21:45 IST
    - cron: "15 16 29 11 *"

    # Safety net: hourly across race weekends (Sat/Sun/Mon, 14:00-23:59 UTC)
    - cron: "5 14-23 * * 6,0,1"
    # Daily backstop at 20:00 IST
    - cron: "30 14 * * *"

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ingest any finished session
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run sync -- --force
          else
            npm run sync
          fi
      - name: Verify the championship still reconciles with motogp.com
        run: npm run verify
      - name: Commit new results
        run: |
          if [ -n "$(git status --porcelain phoenix93.db)" ]; then
            git config user.name "phoenix93-sync"
            git config user.email "sync@users.noreply.github.com"
            git add phoenix93.db
            git commit -m "sync: ingest results ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "Nothing new to ingest."
          fi
